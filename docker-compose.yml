# 本地一把起：Postgres 是唯一事实源，api 无状态。
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rakko
      POSTGRES_PASSWORD: rakko
      POSTGRES_DB: rakko
    ports:
      - '5433:5432'
    volumes:
      - rakko-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rakko -d rakko']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      DATABASE_URL: postgres://rakko:rakko@db:5432/rakko
    ports:
      - '8787:8787'
    depends_on:
      db:
        condition: service_healthy

volumes:
  rakko-pgdata:
